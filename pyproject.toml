[project]
name = "fly-trader"
version = "0.1.0"
description = "FlyWire-connectome memecoin trader on Solana"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch>=2.12",
  "numpy",
  "pandas",
  "pyarrow>=15",
  "duckdb",
  "pytz",                    # duckdb returns TIMESTAMPTZ values through it, declares nothing; pandas 3 brings tzdata instead
  "psycopg[binary]>=3.2",
  "scikit-learn>=1.5",
  "scipy",
  "joblib",
  "solders>=0.21",
  "base58",
  "websockets>=12",
  "httpx>=0.27",
  "python-dotenv",
  "orjson",
  "psutil",
  "kalshi-python-async>=3.10,<3.11",
  "urllib3>=2.8",            # kalshi-python-async imports it (configuration.py) but does not declare it
  "cryptography",
  "aiohttp",
  "coincurve>=20",           # secp256k1: vault claim signatures (EIP-191 / EIP-1271)
  "pycryptodome>=3.20",      # keccak-256 for EIP-55 checksums and Robinhood Chain log topics
  "huggingface_hub>=1.0",    # vault backups to a storage bucket; tools/publish_release.py
  "skops>=0.16",
  "zstandard>=0.25.0",
  "fastapi>=0.143.3",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
# Which torch: plain `uv sync` takes PyPI's wheel (Apple Silicon: MPS; Linux: the CUDA build, ~3 GB). Pick one extra
# to be explicit: `uv sync --extra cpu` (any machine, no GPU), `--extra cu126` or `--extra cu130` (NVIDIA; the CUDA
# runtime ships in the wheel, only the driver must be installed). cu128 stopped at torch 2.11 and does not satisfy the pin.
# `--extra rocm72` (AMD, Linux x86-64): the ROCm 7.2 runtime ships in the wheel too, built for gfx1030, gfx1100-1103,
# gfx1150/1151 (Ryzen AI Max), gfx1200/1201 and the Instinct cards; rocm7.1 stopped at torch 2.13, AMD's own index at 2.11.
cpu = ["torch>=2.12"]
cu126 = ["torch>=2.12; sys_platform != 'darwin'"]   # no CUDA on macOS: there the extra is a no-op and PyPI's wheel stays
cu130 = ["torch>=2.12; sys_platform != 'darwin'"]
rocm72 = [                                          # ROCm wheels exist for nothing but Linux x86-64
  "torch>=2.12; sys_platform == 'linux' and platform_machine == 'x86_64'",
  # torch's own dependency, named so it comes from the ROCm index too (PyPI stops at 3.0.0rc1; torch 2.14 needs 3.8)
  "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }, { extra = "rocm72" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-rocm72", extra = "rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
triton-rocm = [
  { index = "pytorch-rocm72", extra = "rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[project.scripts]
fly-trader = "fly_trader.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fly_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
