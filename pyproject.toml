[project]
name = "fly-trader"
version = "0.1.0"
description = "FlyWire-connectome memecoin trader on Solana"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch>=2.12",
  "numpy",
  "pandas",
  "pyarrow>=15",
  "duckdb",
  "psycopg[binary]>=3.2",
  "scikit-learn>=1.5",
  "scipy",
  "joblib",
  "solders>=0.21",
  "base58",
  "websockets>=12",
  "httpx>=0.27",
  "python-dotenv",
  "orjson",
  "streamlit>=1.40",
  "altair",
  "psutil",
  "kalshi-python-async>=3.10,<3.11",
  "cryptography",
  "aiohttp",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
# Which torch: plain `uv sync` takes PyPI's wheel (Apple Silicon: MPS; Linux: the CUDA build, ~3 GB). Pick one extra
# to be explicit: `uv sync --extra cpu` (any machine, no GPU), `--extra cu126` or `--extra cu130` (NVIDIA; the CUDA
# runtime ships in the wheel, only the driver must be installed). cu128 stopped at torch 2.11 and does not satisfy the pin.
cpu = ["torch>=2.12"]
cu126 = ["torch>=2.12; sys_platform != 'darwin'"]   # no CUDA on macOS: there the extra is a no-op and PyPI's wheel stays
cu130 = ["torch>=2.12; sys_platform != 'darwin'"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
fly-trader = "fly_trader.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fly_trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
